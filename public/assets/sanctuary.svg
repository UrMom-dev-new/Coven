<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Coven sanctuary</title>
  <desc id="desc">A gothic workroom with six witch stations, candles, a planning table, mirror, workbench, wards, archive shelves, and a river portal.</desc>
  <defs>
