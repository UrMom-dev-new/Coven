name: Windows build

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test driver
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Check Settings and Sanctuary in Edge
        run: node scripts/check-settings-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coven-UI-Checks
          path: dist/ui-checks
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Verify local voice installation and real CPU transcription
        timeout-minutes: 8
        run: python scripts/smoke-voice-windows.py
      - name: Build portable bundle
        shell: pwsh
        timeout-minutes: 20
        run: .\scripts\build-windows.ps1 -Clean -SkipSmoke
      - name: Smoke executable boot path
        shell: pwsh
        timeout-minutes: 2
        run: |
          .\scripts\smoke-windows.ps1 -Exe .\dist\Coven\Coven.exe -Token workflow-smoke-token -TimeoutSeconds 45
          Get-ChildItem .\dist\Coven
      - name: Verify packaged GovDash profile persistence and forgetting
        shell: pwsh
        timeout-minutes: 3
        run: .\scripts\smoke-windows.ps1 -Exe .\dist\Coven\Coven.exe -Token browser-profile-smoke -TimeoutSeconds 150 -BrowserProfile
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer artifact
        shell: pwsh
        timeout-minutes: 8
        run: .\scripts\build-installer.ps1
      - name: Smoke installer install/self-test/uninstall
        shell: pwsh
        timeout-minutes: 4
        run: .\scripts\smoke-installer-windows.ps1 -TimeoutSeconds 45
      - uses: actions/upload-artifact@v4
        with:
          name: Coven-Windows-Portable
          path: dist/Coven
      - uses: actions/upload-artifact@v4
        with:
          name: Coven-Windows-Installer
          path: |
            dist/installer/Coven-Setup-x64.exe
            dist/installer/Coven-Setup-x64.exe.sha256

  publish-main:
    # Publish the very same artifacts that passed both Windows jobs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [settings-ui, windows-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: coven-windows-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: Coven-Windows-Portable
          path: release-input/portable/Coven
      - uses: actions/download-artifact@v4
        with:
          name: Coven-Windows-Installer
          path: release-input/installer
      - name: Publish and verify current main Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-windows-main.py
